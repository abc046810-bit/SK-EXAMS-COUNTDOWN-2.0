name = "sk-exams-presence"
main = "src/index.js"
compatibility_date = "2024-11-01"

[durable_objects]
bindings = [
  { name = "PRESENCE_ROOM", class_name = "PresenceRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]

[vars]
# Comma-separated allowed origins, or "*" to allow both Cloudflare Pages and Render domains
ALLOWED_ORIGINS = "*"
